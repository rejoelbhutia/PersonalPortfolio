  <!-- Gradient -->
  <defs>
    <linearGradient id="saasGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"></stop>
      <stop offset="60%" stop-color="#1a1a1a"></stop>
